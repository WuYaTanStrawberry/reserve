<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.line-scdn.net https://*.line-scdn.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.line-scdn.net; connect-src 'self' https://api.wuyatanstrawberry.com https://*.line.me https://*.line-scdn.net https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; object-src 'none'">
  <title>🍓 舞夜天高架草莓園｜停車預約</title>
  <meta name="theme-color" content="#fff7f8">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://api.wuyatanstrawberry.com" crossorigin>
  <link rel="preconnect" href="https://static.line-scdn.net">
  <link rel="preload" as="image" href="logo-sm.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <img class="brand-mark" src="logo-sm.png" alt="舞夜天高架草莓園" width="76" height="57">
    <h1>舞夜天高架草莓園</h1>
    <p>停車預約・選好日期,留下姓名電話即可</p>
  </header>

  <main class="wrap">
    <div class="card">
      <p class="banner info" style="margin-top:0">👨‍👩‍👧‍👦 入園<b>不限人數</b>!因停車場車位有限,採「依車輛」訂位——請照當天開來的<b>車輛數</b>預約即可 🚗</p>

      <form id="bookForm" novalidate>
        <label for="date">選擇日期</label>
        <input type="date" id="date" name="date" required>
        <div id="dateBanner" role="status" aria-live="polite"></div>

        <div id="slotSection" hidden>
          <span class="label" id="slotLabel">選擇時段</span>
          <div id="slotNote"></div>
          <div class="slots" id="slots" role="radiogroup" aria-labelledby="slotLabel"></div>
        </div>

        <div id="formSection" hidden>
          <div id="modeNote"></div>

          <span class="label" id="vehLabel">車輛種類</span>
          <div class="veh" role="radiogroup" aria-labelledby="vehLabel">
            <label>
              <input type="radio" name="vehicle" value="car" checked>
              <span>🚗 汽車<small>佔用車位</small></span>
            </label>
            <label>
              <input type="radio" name="vehicle" value="motor">
              <span>🏍️ 機車<small>不佔車位</small></span>
            </label>
          </div>

          <div id="carQtyWrap">
            <label for="carQty">開幾台車來?</label>
            <select id="carQty" name="cars"></select>
          </div>

          <label for="name">姓名</label>
          <input type="text" id="name" name="name" placeholder="您的稱呼" maxlength="30"
                 autocomplete="name" enterkeyhint="next" required>

          <label for="phone">聯絡電話</label>
          <input type="tel" id="phone" name="phone" placeholder="例:0912345678" maxlength="20"
                 autocomplete="tel" inputmode="numeric" enterkeyhint="done" required>

          <p class="banner warn">⏰ 車位保留至預約時段開始後 <b>10 分鐘</b>,逾時將先開放給現場客人,敬請準時到達 🙏</p>
          <div id="formBanner" role="alert" aria-live="assertive"></div>

          <input type="text" id="hp_field" name="nickname" tabindex="-1" autocomplete="off" aria-hidden="true"
                 class="sr-only">
          <!-- 人機驗證:後台沒填 Turnstile 金鑰時整塊都不會出現 -->
          <div id="tsBox" hidden><div id="tsWidget"></div></div>
          <button class="primary" id="submitBtn" type="submit">送出預約</button>
        </div>
      </form>
    </div>

    <!-- 後台入口刻意不放連結:園主用手機主畫面捷徑進入。
         這不是「藏起來」(repo 是公開的,檔名看得到),而是讓路過的客人與爬蟲不會誤入。 -->
  </main>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
