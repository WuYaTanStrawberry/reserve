<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🍓 舞夜天高架草莓園｜停車預約</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>🍓 舞夜天高架草莓園</h1>
    <p>停車預約・選好日期與時段,留下姓名電話即可</p>
  </header>

  <div class="wrap">
    <div class="card">
      <label for="date">選擇日期</label>
      <input type="date" id="date">
      <div id="dateBanner"></div>

      <div id="slotSection" style="display:none">
        <label>選擇時段(數字為剩餘汽車車位)</label>
        <div class="slots" id="slots"></div>
      </div>

      <div id="formSection" style="display:none">
        <label>車輛種類</label>
        <div class="veh">
          <label><input type="radio" name="vehicle" value="car" checked><span>🚗 汽車(佔車位)</span></label>
          <label><input type="radio" name="vehicle" value="motor"><span>🏍️ 機車(不佔車位)</span></label>
        </div>
        <div id="carQtyWrap">
          <label for="carQty">汽車數量(一次幾台車)</label>
          <select id="carQty"></select>
        </div>
        <label for="name">姓名</label>
        <input type="text" id="name" placeholder="您的稱呼" maxlength="30">
        <label for="phone">聯絡電話</label>
        <input type="tel" id="phone" placeholder="例:0912345678" maxlength="20">
        <div id="formBanner"></div>
        <button class="primary" id="submitBtn">送出預約</button>
      </div>
    </div>
    <div class="foot-link"><a href="admin.html">園主後台登入 →</a></div>
  </div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
