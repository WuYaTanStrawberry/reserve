<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🍓 舞夜天高架草莓園｜停車預約</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://static.line-scdn.net">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>🍓 舞夜天高架草莓園</h1>
    <p>停車預約・選好日期,留下姓名電話即可</p>
  </header>

  <div class="wrap">
    <div class="card">
      <div class="banner ok" style="margin-top:0">👨‍👩‍👧‍👦 入園<b>不限人數</b>!因停車場車位有限,採「依車輛」訂位——請照當天開來的<b>車輛數</b>預約即可 🚗</div>
      <label for="date">選擇日期</label>
      <input type="date" id="date">
      <div id="dateBanner"></div>

      <div id="slotSection" style="display:none">
        <label id="slotLabel">選擇時段(數字為剩餘汽車車位)</label>
        <div id="slotNote"></div>
        <div class="slots" id="slots"></div>
      </div>

      <div id="formSection" style="display:none">
        <div id="modeNote"></div>
        <label>車輛種類</label>
        <div class="veh">
          <label><input type="radio" name="vehicle" value="car" checked><span>🚗 汽車(佔車位)</span></label>
          <label><input type="radio" name="vehicle" value="motor"><span>🏍️ 機車(不佔車位)</span></label>
        </div>
        <div id="carQtyWrap">
          <label for="carQty">汽車數量(一次幾台車)</label>
          <select id="carQty"></select>
        </div>
        <label for="name">姓名</label>
        <input type="text" id="name" placeholder="您的稱呼" maxlength="30">
        <label for="phone">聯絡電話</label>
        <input type="tel" id="phone" placeholder="例:0912345678" maxlength="20">
        <div class="banner warn" style="margin-top:6px">⏰ 車位保留至預約時段開始後 <b>10 分鐘</b>,逾時將先開放給現場客人,敬請準時到達 🙏</div>
        <div id="formBanner"></div>
        <button class="primary" id="submitBtn">送出預約</button>
      </div>
    </div>
    <div class="foot-link"><a href="admin.html" aria-label="管理" style="font-size:.7rem;color:#ecdce0;text-decoration:none">·</a></div>
  </div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
